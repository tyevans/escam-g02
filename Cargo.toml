[workspace]
resolver = "2"
members = [
    "crates/escam-core",
    "crates/escam-driver",
    "crates/escam-ptz",
    "crates/escam-media",
    "crates/escam-astro",
    "crates/escam-web",
    "crates/escam-system",
    "crates/motor-test",
    "crates/escamd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ESCAM G02 Open Firmware Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
panic = "abort"
strip = true
