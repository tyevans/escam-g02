[package]
name = "escam-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
escam-core = { path = "../escam-core" }
escam-driver = { path = "../escam-driver" }
escam-ptz = { path = "../escam-ptz" }
escam-media = { path = "../escam-media" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.42", features = ["sync", "time", "net", "rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
